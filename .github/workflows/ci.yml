name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies without optional native builds
        run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package:universal
      - uses: actions/upload-artifact@v4
        with:
          name: reconciledb-vscode-universal
          path: artifacts/reconciledb-vscode-1.0.0-universal.vsix

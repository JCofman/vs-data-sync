name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        shell: bash
        run: node -e "const expected='v'+require('./package.json').version; if (process.env.GITHUB_REF_NAME !== expected) { throw new Error(`Expected tag ${expected}, got ${process.env.GITHUB_REF_NAME}`); }"
      - name: Install dependencies without optional native builds
        run: npm ci --ignore-scripts
      - run: npm run compile
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package:universal
      - uses: actions/upload-artifact@v4
        with:
          name: reconciledb-vscode-universal
          path: artifacts/*-universal.vsix

  publish:
    needs: package-universal
    runs-on: ubuntu-latest
    environment: extension-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: reconciledb-vscode-*
          path: artifacts
          merge-multiple: true
      - name: Verify registry credentials before publishing
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          test -n "$VSCE_PAT" || { echo 'VSCE_PAT is not configured in the extension-release environment.'; exit 1; }
          test -n "$OPEN_VSX_TOKEN" || { echo 'OPEN_VSX_TOKEN is not configured in the extension-release environment.'; exit 1; }
          PUBLISHER=$(node -p "require('./package.json').publisher")
          npm exec -- vsce verify-pat "$PUBLISHER" -p "$VSCE_PAT"
      - name: Verify or create Open VSX namespace
        shell: bash
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          if ! npm exec -- ovsx verify-pat "$PUBLISHER" -p "$OPEN_VSX_TOKEN"; then
            npm exec -- ovsx create-namespace "$PUBLISHER" -p "$OPEN_VSX_TOKEN"
            npm exec -- ovsx verify-pat "$PUBLISHER" -p "$OPEN_VSX_TOKEN"
          fi
      - name: Publish universal package to Visual Studio Marketplace
        run: npm exec -- vsce publish --skip-duplicate --packagePath artifacts/*-universal.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish universal package to Open VSX
        run: npm exec -- ovsx publish --skip-duplicate artifacts/*-universal.vsix -p "$OPEN_VSX_TOKEN"
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "$GITHUB_REF_NAME" artifacts/*.vsix --verify-tag --generate-notes --title "ReconcileDB for VS Code $VERSION"
